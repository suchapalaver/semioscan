[package]
name = "semioscan"
version = "0.15.3"
edition = "2021"
authors = ["Joseph Livesey <jlivesey@gmail.com>"]
rust-version = "1.92"
description = "Production-grade Rust library for blockchain analytics: gas calculation, price extraction, and block window calculations for EVM chains"
license = "Apache-2.0"
repository = "https://github.com/suchapalaver/semioscan"
homepage = "https://github.com/suchapalaver/semioscan"
documentation = "https://docs.rs/semioscan"
keywords = ["ethereum", "blockchain", "analytics", "defi", "evm"]
categories = ["cryptography::cryptocurrencies", "development-tools"]

[features]
default = ["blocks", "events", "gas", "price", "provider", "retrieval", "transport"]
# Block-window calculations: map UTC dates to block ranges.
blocks = []
# Log scanning and event decoding (Transfer/Approval, EventScanner).
events = []
# Transport-layer Tower middleware (rate limiting, retries).
transport = []
# Gas cost calculation (L1 + L2). Decodes Transfer/Approval, so pulls in `events`.
gas = ["events"]
# DEX price extraction. Uses on-chain token decimals via `alloy-erc20`.
price = ["dep:alloy-erc20"]
# Runtime provider construction and pooling; layers rate limiting from `transport`.
provider = ["transport"]
# High-level orchestration combining gas, events, and balance lookups.
retrieval = ["events", "gas", "dep:alloy-erc20"]
# WebSocket transport; composes with `provider`.
ws = ["provider", "alloy-provider/pubsub", "alloy-provider/ws"]

[dependencies]
# Core blockchain dependencies (always required)
alloy-chains = { version = "0.2", features = ["serde"] }
alloy-consensus = { version = "2.0", default-features = false }
alloy-contract = { version = "2.0", default-features = false }
alloy-dyn-abi = { version = "1.6", default-features = false }
alloy-json-rpc = "2.0"
alloy-eips = { version = "2.0", default-features = false }
alloy-erc20 = { version = "2.0", default-features = false, optional = true }
alloy-network = { version = "2.0", default-features = false }
alloy-primitives = { version = "1.6", default-features = false, features = [
    "std",
    "rlp",
] }
alloy-provider = { version = "2.0", default-features = false, features = [
    "anvil-node",
    "reqwest",
] }
alloy-rpc-client = "2.0"
alloy-rpc-types = "2.0"
alloy-sol-types = { version = "1.6", features = ["json"] }
alloy-sol-type-parser = "1.6"
alloy-transport = "2.0"
alloy-transport-http = { version = "2.0", default-features = false, features = [
    "reqwest",
] }
async-trait = "0.1"
# futures with std enables join_all for batch RPC calls and StreamExt for streaming
futures = { version = "0.3", default-features = false, features = [
    "alloc",
    "std",
] }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
op-alloy-network = "2.0"
url = { version = "2.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "sync"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"

[dev-dependencies]
alloy-consensus = "2.0"
alloy-transport = "2.0"
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
proptest = "1.11"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
] }

[[example]]
name = "custom_dex_integration"
required-features = ["price"]

[[example]]
name = "daily_block_window"
required-features = ["blocks"]

[[example]]
name = "eip4844_blob_gas"
required-features = ["gas"]

[[example]]
name = "zksync_combined_probe"
required-features = ["retrieval", "provider"]
